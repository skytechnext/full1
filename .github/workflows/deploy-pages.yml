name: Deploy to GitHub Pages

# Publishes the HTML report and companion pages to GitHub Pages.
# Requires GitHub Pages "Source = GitHub Actions" (Settings -> Pages).
# The configure-pages step attempts to auto-enable Pages where the repo allows it.

on:
  push:
    branches:
      - claude/casa-escondida-odoo-erp-o9r79d
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site (HTML + PWA assets at root)
        run: |
          mkdir -p _site
          cp index.html stakeholder-questions.html staff-guides.html odoo-sales.html odoo-demo-guide.html _site/ 2>/dev/null || true
          cp manifest.webmanifest sw.js icon-192.png icon-512.png _site/ 2>/dev/null || true
          cp -r assets _site/ 2>/dev/null || true
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
